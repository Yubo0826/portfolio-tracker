<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Sidebar Demo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --hover-bg: #282a2c;
            --active-bg: #333537;
            --text-color: #e3e3e3;
            --text-muted: #80868b;
            --sidebar-width-expanded: 280px;
            --sidebar-width-collapsed: 68px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar Container --- */
        .sidebar {
            width: var(--sidebar-width-expanded);
            background-color: var(--sidebar-bg);
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px;
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        /* Collapsed State Class */
        .sidebar.collapsed {
            width: var(--sidebar-width-collapsed);
        }

        /* --- Header / Top Controls --- */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 12px;
            margin-bottom: 16px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gemini-logo {
            width: 24px;
            height: 24px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 400;
            transition: opacity 0.15s ease;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-btn:hover {
            background-color: var(--hover-bg);
        }

        /* --- Navigation Items --- */
        .nav-item {
            display: flex;
            align-items: center;
            height: 48px;
            padding: 0 12px;
            border-radius: 24px;
            text-decoration: none;
            color: var(--text-color);
            margin-bottom: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .nav-item.active {
            background-color: var(--active-bg);
        }

        .nav-item:hover:not(.active) {
            background-color: var(--hover-bg);
        }

        /* CRITICAL: Icons must have a fixed container size so they never shift */
        .nav-icon {
            font-size: 24px;
            min-width: 24px;
            width: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px; /* Spacing between icon and text */
        }

        .nav-text {
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.15s ease;
        }

        /* --- Notebook Section --- */
        .section-divider {
            margin: 20px 0 12px 12px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            transition: opacity 0.15s ease;
        }

        /* --- Collapsible Element Behaviors --- */
        .sidebar.collapsed .brand-name,
        .sidebar.collapsed .nav-text,
        .sidebar.collapsed .section-divider {
            opacity: 0;
            pointer-events: none;
        }

        /* --- Main Content Area Placeholder --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-content h1 {
            color: var(--text-muted);
            font-weight: 300;
        }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-section">
                <svg class="gemini-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C12 2 13 8 16 11C19 14 24 14 24 14C24 14 18 15 15 18C12 21 12 24 12 24C12 24 11 18 8 15C5 12 0 12 0 12C0 12 6 11 9 8C12 5 12 2 12 2Z" fill="url(#gemini-grad)"/>
                    <defs>
                        <linearGradient id="gemini-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FF512F"/>
                            <stop offset="50%" stop-color="#DD2476"/>
                            <stop offset="100%" stop-color="#4facfe"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="brand-name">Gemini</span>
            </div>
            <button class="toggle-btn" id="toggleBtn" title="Toggle Sidebar">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>

        <a class="nav-item active">
            <span class="material-symbols-outlined nav-icon">edit_note</span>
            <span class="nav-text">新對話</span>
        </a>
        <a class="nav-item">
            <span class="material-symbols-outlined nav-icon">search</span>
            <span class="nav-text">搜尋對話</span>
        </a>
        <a class="nav-item">
            <span class="material-symbols-outlined nav-icon">apps</span>
            <span class="nav-text">媒體庫</span>
        </a>

        <div class="section-divider">筆記本</div>

        <a class="nav-item">
            <span class="material-symbols-outlined nav-icon">add</span>
            <span class="nav-text">新增筆記本</span>
        </a>
        <a class="nav-item">
            <span class="material-symbols-outlined nav-icon">book</span>
            <span class="nav-text">學英文</span>
        </a>
    </nav>

    <main class="main-content">
        <h1>Main Viewport Area</h1>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });
    </script>
</body>
</html>
